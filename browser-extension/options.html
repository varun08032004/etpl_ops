<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>EtherTrack Tab Reporter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #14171c; color: #eaecef;
    width: 320px; padding: 20px;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { font-size: 12px; color: #9aa1ac; line-height: 1.5; margin: 0 0 14px; }
  label { display: block; font-size: 11.5px; color: #9aa1ac; margin-bottom: 5px; }
  input {
    width: 100%; padding: 8px 9px; border-radius: 6px; border: 1px solid #2c313a;
    background: #1b1f26; color: #eaecef; font-size: 12.5px; font-family: monospace;
  }
  input:focus { outline: none; border-color: #4c8dff; }
  button {
    width: 100%; margin-top: 12px; padding: 9px; border: none; border-radius: 6px;
    background: #4c8dff; color: white; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .status { font-size: 11.5px; margin-top: 10px; min-height: 14px; }
  .status.ok { color: #4ade80; }
  .status.err { color: #ff6b6b; }
  .state { display: flex; align-items: center; gap: 6px; font-size: 11.5px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #2c313a; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6d7480; }
  .dot.connected { background: #4ade80; }
</style>
</head>
<body>
  <h1>EtherTrack Tab Reporter</h1>
  <p>
    Pair this with your EtherTrack Agent so your active website is
    reported accurately instead of guessed from the tab title. Get the
    pairing token from your admin, or from <code>config.json</code> in the
    agent install (<code>localServerToken</code>).
  </p>

  <label for="token">Pairing token</label>
  <input id="token" type="text" autocomplete="off" placeholder="paste token here" />
  <button id="save">Save</button>
  <div class="status" id="status"></div>

  <div class="state">
    <div class="dot" id="dot"></div>
    <span id="stateText">Checking connection…</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
