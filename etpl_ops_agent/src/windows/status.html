<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>EtherTrack Agent</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #14171c; color: #eaecef;
    padding: 20px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 15px; margin: 0; }
  .badge {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600;
  }
  .badge.online { background: #16351f; color: #4ade80; }
  .badge.offline { background: #2a2d33; color: #9aa1ac; }
  .badge.punched-in { background: #1e3a5f; color: #60a5fa; }
  .clock-in { font-size: 11px; color: #6d7480; margin-top: 3px; }

  .stats { display: flex; gap: 10px; margin: 18px 0; }
  .stat { flex: 1; background: #1b1f26; border-radius: 8px; padding: 10px; }
  .stat .label { font-size: 10px; color: #9aa1ac; }
  .stat .value { font-size: 16px; font-weight: 600; margin-top: 2px; }

  .current { background: #1b1f26; border-radius: 8px; padding: 12px; margin-bottom: 18px; }
  .current .label { font-size: 10px; color: #9aa1ac; margin-bottom: 4px; }
  .current .app { font-size: 13px; font-weight: 600; }
  .current .site { font-size: 11.5px; color: #9aa1ac; margin-top: 2px; }

  .punch-status { 
    background: #1b1f26; border-radius: 8px; padding: 12px; margin-bottom: 18px; 
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .punch-status .label { font-size: 10px; color: #9aa1ac; }
  .punch-status .time { font-size: 14px; font-weight: 600; }
  .punch-status .punch-in { color: #4ade80; }
  .punch-status .punch-out { color: #f87171; }
  .punch-status .late { color: #fbbf24; }
  .punch-status .early { color: #f87171; }
  .punch-status .separator { color: #4a5058; }

  button {
    width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
  }
  .punch-in-btn { background: #22c55e; color: white; }
  .punch-out-btn { background: #ef4444; color: white; }
  .punch-btn:disabled { background: #3d4450; cursor: not-allowed; }
  .undo-btn { background: #f59e0b; color: white; }
  .signout { background: transparent; color: #6d7480; font-weight: 400; font-size: 11.5px; margin-top: 4px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="row">
    <h1>EtherTrack</h1>
    <span class="badge offline" id="badge">Offline</span>
  </div>
  <div class="clock-in" id="clockIn"></div>

  <div class="stats">
    <div class="stat"><div class="label">WORKED</div><div class="value" id="worked">0h 0m</div></div>
    <div class="stat"><div class="label">IDLE</div><div class="value" id="idle">0h 0m</div></div>
  </div>

  <div class="current">
    <div class="label">CURRENT APP</div>
    <div class="app" id="currentApp">—</div>
    <div class="site" id="currentSite"></div>
  </div>

  <!-- Punch In/Out Status -->
  <div class="punch-status" id="punchStatus" style="display: none;">
    <div class="label">TODAY</div>
    <div class="time punch-in" id="punchInTime">—</div>
    <span class="separator">|</span>
    <div class="time punch-out" id="punchOutTime">—</div>
    <span id="lateBadge" class="late hidden">⚠ Late</span>
    <span id="earlyBadge" class="early hidden">⚠ Early Leave</span>
  </div>

  <!-- Working Hours Info -->
  <div class="current" id="workingHoursInfo" style="display: none; margin-bottom: 18px;">
    <div class="label">WORK HOURS</div>
    <div class="app" id="workingHours">—</div>
    <div class="site" id="nextPunchOut"></div>
  </div>

  <!-- Punch In/Out Controls (MAIN ACTIONS) -->
  <div id="punchControls">
    <button class="punch-btn punch-in-btn" id="punchInBtn">Punch In</button>
    <button class="punch-btn punch-out-btn hidden" id="punchOutBtn">Punch Out</button>
    <button class="punch-btn undo-btn hidden" id="undoPunchInBtn">Undo Punch In</button>
    <button class="punch-btn undo-btn hidden" id="undoPunchOutBtn">Undo Punch Out</button>
  </div>

  <button class="signout" id="signOutBtn">Sign out of this device</button>

  <div class="current" id="pairingSection" style="display:none; margin-top: 18px;">
    <div class="label">BROWSER EXTENSION PAIRING TOKEN</div>
    <div class="app" style="font-family: monospace; font-size: 11px; word-break: break-all;" id="pairingToken"></div>
    <div class="label" style="margin-top: 8px; font-size: 9px;">Copy this token into the EtherTrack Browser Extension options page</div>
    <button class="start" id="copyTokenBtn" style="margin-top: 8px; padding: 6px; font-size: 11px;">Copy Token</button>
  </div>

  <script src="status.js"></script>
</body>
</html>
